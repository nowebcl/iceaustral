name: Supabase Keep-Alive

on:
  schedule:
    # Se ejecuta cada 3 días a las 06:00 UTC
    - cron: '0 6 */3 * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub Actions

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        run: |
          echo "Realizando consulta de mantenimiento a Supabase..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET "https://nlnjjttfacpbsdrahfmc.supabase.co/rest/v1/products?select=id&limit=1" \
            -H "apikey: sb_publishable_IlW8hd1Q1bs7z5hQHw44TQ_nH0poNR8" \
            -H "Authorization: Bearer sb_publishable_IlW8hd1Q1bs7z5hQHw44TQ_nH0poNR8")
          
          echo "Respuesta de Supabase HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "¡Base de datos activa y operativa con éxito!"
          else
            echo "Aviso: Respuesta HTTP no esperada ($HTTP_STATUS)"
          fi
